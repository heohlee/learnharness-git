name: Release package

# Attaches the prebuilt package (learnharness-git-X.Y.Z.zip) to a published release.
# Project-owned: not part of the kit's release.yml, which only creates the release.
# Runs after the Release workflow succeeds: a release created with github.token does not
# trigger `release` events for other workflows. workflow_dispatch re-attaches by hand.
on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (vX.Y.Z)
        required: true

permissions: {}

concurrency:
  group: release-package-${{ inputs.tag || github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  package:
    name: Attach plugin zip
    # For workflow_run, head_branch is the pushed tag.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.event.workflow_run.head_branch }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      # The tag (vX.Y.Z) must match the package.json and manifest.json versions.
      - name: Check tag and versions
        id: version
        env:
          TAG: ${{ inputs.tag || github.event.workflow_run.head_branch }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          MANIFEST="$(node -p "require('./manifest.json').version")"
          if [ "$TAG" != "v$VERSION" ] || [ "$MANIFEST" != "$VERSION" ]; then
            echo "::error::Tag $TAG does not match package.json $VERSION and manifest.json $MANIFEST"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Install scripts are skipped; none are needed to build the plugin.
      - name: Install
        run: npm ci --ignore-scripts

      - name: Package
        run: npm run package

      - name: Upload zip to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.event.workflow_run.head_branch }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release upload "$TAG" "releases/learnharness-git-${VERSION}.zip" --clobber
