version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '05:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns: ['*']

  # Stack ecosystems (gomod, npm, docker, ...) go below, one list entry each,
  # indented like the github-actions entry above. Stack module READMEs give the entry.
  # local: ecosystems
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '05:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      npm:
        patterns: ['*']
    ignore:
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  # /local: ecosystems
